<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Website Under Maintenance</title>

  <meta
    name="description"
    content="Our website is currently undergoing scheduled maintenance. Please visit again soon."
  />

  <style>
    :root {
      --background: #07111f;
      --background-secondary: #0d1b2f;
      --card: rgba(13, 27, 47, 0.72);
      --text: #f7f9fc;
      --muted: #9eacc0;
      --accent: #6c7cff;
      --accent-secondary: #28d7c0;
      --border: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 20%, rgba(108, 124, 255, 0.22), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(40, 215, 192, 0.16), transparent 28%),
        linear-gradient(135deg, var(--background), var(--background-secondary));
    }

    .background-grid {
      position: fixed;
      inset: 0;
      z-index: -3;
      opacity: 0.17;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 45px 45px;
      mask-image: linear-gradient(to bottom, black, transparent);
    }

    .glow {
      position: fixed;
      z-index: -2;
      width: 350px;
      height: 350px;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.28;
      animation: float 10s ease-in-out infinite;
    }

    .glow-one {
      top: -100px;
      left: -100px;
      background: var(--accent);
    }

    .glow-two {
      right: -100px;
      bottom: -100px;
      background: var(--accent-secondary);
      animation-delay: -4s;
    }

    .maintenance-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 30px 20px;
    }

    .maintenance-card {
      width: min(760px, 100%);
      padding: clamp(32px, 6vw, 64px);
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--card);
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      animation: cardEntrance 0.9s ease forwards;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      padding: 9px 16px;
      color: #cdd5ff;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border: 1px solid rgba(108, 124, 255, 0.35);
      border-radius: 999px;
      background: rgba(108, 124, 255, 0.1);
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent-secondary);
      box-shadow: 0 0 0 0 rgba(40, 215, 192, 0.5);
      animation: pulse 1.8s infinite;
    }

    .icon-wrapper {
      position: relative;
      width: 130px;
      height: 130px;
      margin: 0 auto 28px;
      display: grid;
      place-items: center;
    }

    .orbit {
      position: absolute;
      inset: 0;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      animation: rotate 7s linear infinite;
    }

    .orbit::before {
      content: "";
      position: absolute;
      top: 10px;
      left: 50%;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent-secondary);
      box-shadow: 0 0 18px var(--accent-secondary);
      transform: translateX(-50%);
    }

    .tool-icon {
      width: 76px;
      height: 76px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 22px;
      background: linear-gradient(
        145deg,
        rgba(108, 124, 255, 0.24),
        rgba(40, 215, 192, 0.1)
      );
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
    }

    .tool-icon svg {
      width: 38px;
      height: 38px;
      stroke: white;
    }

    h1 {
      margin-bottom: 18px;
      font-size: clamp(2.2rem, 7vw, 4.6rem);
      line-height: 1.03;
      letter-spacing: -0.055em;
    }

    .gradient-text {
      color: transparent;
      background: linear-gradient(90deg, #ffffff, #a8b0ff, #6ef2df);
      background-clip: text;
      -webkit-background-clip: text;
    }

    .description {
      max-width: 590px;
      margin: 0 auto;
      color: var(--muted);
      font-size: clamp(1rem, 2.2vw, 1.15rem);
      line-height: 1.8;
    }

    .progress-section {
      max-width: 500px;
      margin: 36px auto 0;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 12px;
      color: #dce2ed;
      font-size: 0.88rem;
    }

    .progress-track {
      height: 10px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
    }

    .progress-bar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent-secondary));
      box-shadow: 0 0 20px rgba(108, 124, 255, 0.65);
      animation: progress 2.2s ease forwards 0.5s;
    }

    .footer-message {
      margin-top: 30px;
      color: #77869c;
      font-size: 0.82rem;
      letter-spacing: 0.02em;
    }

    .footer-message span {
      color: #b9c4d4;
    }

    @keyframes progress {
      from {
        width: 0;
      }

      to {
        width: 78%;
      }
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(40, 215, 192, 0.55);
      }

      70% {
        box-shadow: 0 0 0 10px rgba(40, 215, 192, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(40, 215, 192, 0);
      }
    }

    @keyframes rotate {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes float {
      0%,
      100% {
        transform: translate3d(0, 0, 0);
      }

      50% {
        transform: translate3d(25px, 35px, 0);
      }
    }

    @keyframes cardEntrance {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 520px) {
      .maintenance-card {
        padding: 38px 22px;
        border-radius: 22px;
      }

      .icon-wrapper {
        width: 110px;
        height: 110px;
      }

      .tool-icon {
        width: 66px;
        height: 66px;
      }

      .progress-header {
        font-size: 0.8rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>
  <div class="background-grid"></div>
  <div class="glow glow-one"></div>
  <div class="glow glow-two"></div>

  <main class="maintenance-page">
    <section class="maintenance-card">
      <div class="status-badge">
        <span class="status-dot"></span>
        Scheduled Maintenance
      </div>

      <div class="icon-wrapper" aria-hidden="true">
        <div class="orbit"></div>

        <div class="tool-icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M14.7 6.3a4 4 0 0 0-5.1 5.1L3 18l3 3 6.6-6.6a4 4 0 0 0 5.1-5.1l-2.4 2.4-3-3 2.4-2.4Z" />
          </svg>
        </div>
      </div>

      <h1>
        Making things
        <span class="gradient-text">even better.</span>
      </h1>

      <p class="description">
        Website is currently undergoing scheduled maintenance and
        improvements. It will be back online soon with a faster, smoother and
        better experience.
      </p>

      <div class="progress-section">
        <div class="progress-header">
          <span>System improvements in progress</span>
          <span id="progressText">0%</span>
        </div>

        <div
          class="progress-track"
          role="progressbar"
          aria-label="Maintenance progress"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="78"
        >
          <div class="progress-bar"></div>
        </div>
      </div>

      <p class="footer-message">
        Thank you for your patience. Please <span>visit again later.</span>
      </p>
    </section>
  </main>

  <script>
    const progressText = document.getElementById("progressText");
    const targetProgress = 78;
    let currentProgress = 0;

    function updateProgress() {
      if (currentProgress < targetProgress) {
        currentProgress += 1;
        progressText.textContent = `${currentProgress}%`;
        requestAnimationFrame(updateProgress);
      }
    }

    setTimeout(updateProgress, 500);
  </script>
</body>
</html>
